name: Liberar pedidos expirados

# Cancela pedidos pendientes vencidos y devuelve su stock.
# Requiere el secreto CRON_SECRET del repo (el mismo que en Render).
# Manda un email a la casilla oficial cuando libera pedidos o cuando falla.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      forzar_aviso:
        description: "Mandar un email de prueba aunque no haya pedidos liberados"
        type: boolean
        default: false

jobs:
  liberar:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al backend
        id: liberar
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://hefestotech.onrender.com' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Falta el secreto CRON_SECRET en GitHub."; exit 1
          fi
          respuesta=$(curl --fail --silent --show-error --max-time 90 --retry 2 \
            -X POST "$BACKEND_URL/api/checkout/liberar-expiradas" \
            -H "x-cron-secret: $CRON_SECRET")
          echo "$respuesta"
          revisadas=$(echo "$respuesta" | jq -r '.revisadas // 0')
          liberadas=$(echo "$respuesta" | jq -r '.liberadas // 0')
          echo "revisadas=$revisadas" >> "$GITHUB_OUTPUT"
          echo "liberadas=$liberadas" >> "$GITHUB_OUTPUT"

      # Aviso por email (Gmail SMTP). Nunca hace fallar el job: si el correo
      # no sale, el pedido igual se liberó.
      - name: Avisar por email
        if: always()
        env:
          GMAIL_USER: ${{ vars.GMAIL_USER || 'Hefestotech077@gmail.com' }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ vars.MAIL_TO || 'Hefestotech077@gmail.com' }}
          RESULTADO: ${{ steps.liberar.outcome }}
          LIBERADAS: ${{ steps.liberar.outputs.liberadas }}
          REVISADAS: ${{ steps.liberar.outputs.revisadas }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FORZAR: ${{ inputs.forzar_aviso }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          usuario = os.environ.get("GMAIL_USER", "").strip()
          # Google muestra la clave en grupos de 4: si se copia con espacios, se sacan.
          clave = os.environ.get("GMAIL_APP_PASSWORD", "").replace(" ", "").strip()
          destino = os.environ.get("MAIL_TO", "").strip() or usuario
          resultado = os.environ.get("RESULTADO", "")
          forzar = os.environ.get("FORZAR", "").lower() == "true"

          liberadas = int(os.environ.get("LIBERADAS") or 0)
          revisadas = int(os.environ.get("REVISADAS") or 0)
          run_url = os.environ.get("RUN_URL", "")

          if not usuario or not clave:
              print("Falta GMAIL_APP_PASSWORD en GitHub: no se manda el email.")
              raise SystemExit(0)

          if resultado == "success" and liberadas == 0 and not forzar:
              print("Sin pedidos liberados: no se manda email.")
              raise SystemExit(0)

          if forzar:
              asunto = "HefestoTech · Prueba del aviso del liberador"
              cuerpo = f"Email de prueba del workflow de pedidos vencidos.\n\nRun: {run_url}\n"
          elif resultado == "success":
              asunto = f"HefestoTech · {liberadas} pedido(s) vencido(s) liberado(s)"
              cuerpo = (
                  f"Se liberaron {liberadas} de {revisadas} pedidos revisados.\n"
                  "El stock volvió a la tienda.\n\n"
                  f"Run: {run_url}\n"
              )
          else:
              asunto = "HefestoTech · Falló el liberador de pedidos"
              cuerpo = (
                  "El workflow no pudo completar la limpieza de pedidos vencidos.\n\n"
                  f"Run: {run_url}\n"
              )

          mensaje = EmailMessage()
          mensaje["From"] = usuario
          mensaje["To"] = destino
          mensaje["Subject"] = asunto
          mensaje.set_content(cuerpo)

          try:
              contexto = ssl.create_default_context()
              with smtplib.SMTP_SSL("smtp.gmail.com", 465, context=contexto, timeout=30) as servidor:
                  servidor.login(usuario, clave)
                  servidor.send_message(mensaje)
              print(f"Email enviado a {destino}.")
          except Exception as error:
              print(f"ERROR al enviar el email: {error}")
          PY
