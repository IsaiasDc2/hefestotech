name: Deploy a GitHub Pages

# Requiere una sola vez: Settings → Pages → Source: "GitHub Actions".
# Variables del repo (Settings → Secrets and variables → Actions → Variables):
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, VITE_API_URL
# (son valores públicos del frontend; las claves privadas van solo en el backend).

on:
  # Deploy automático activado: Pages ya está en "GitHub Actions" y las
  # variables VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY y VITE_API_URL
  # están cargadas en Settings → Secrets and variables → Actions → Variables.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecomers/client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ecomers/client/package-lock.json
      - run: npm ci
      # Las variables del repo tienen prioridad. Si todavía no están cargadas,
      # se usan estos valores por defecto: son claves PÚBLICAS (las que ve
      # cualquier navegador y que RLS protege), no secretos. Sin esto el sitio
      # se publicaba en modo demo aunque el build fuera correcto.
      - run: npm run build
        env:
          VITE_BASE: /hefestotech/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ewqwmzwtrsjlrrnrotcm.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_2iI32AYW4QMFLzBRfsX6mA_x64hW1sG' }}
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://hefestotech.onrender.com' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ecomers/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
